<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Virtual Hallo"weenie" – The Witch's Attic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <!-- Scene: low-res canvas scaled up with crisp pixels -->
    <canvas id="scene" width="256" height="448" aria-label="A pixel-art witch's attic with a black cat, a bubbling cauldron and shelves of potions" role="img"></canvas>

    <!-- Progressive text hints and story messages (written by story.js) -->
    <p id="hint" role="status" aria-live="polite"></p>

    <!-- Progress bar (story.js): one segment per story found; the stories can be found in any order -->
    <div id="progress" role="progressbar" aria-label="Stories found" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-valuetext="0 of 3 stories found">
      <span class="seg"></span><span class="seg"></span><span class="seg"></span>
      <span id="progressCount" aria-hidden="true">0/3</span>
    </div>

    <!-- Single Play/Pause control: pauses motion, sound, effects, timers and interaction together -->
    <button id="playpause" type="button" aria-label="Pause" aria-pressed="false" hidden></button>

    <!-- Spellbook riddle (story2.js): the open book is drawn on the canvas, the text sits on its left page -->
    <div id="riddle" role="group" aria-label="The spellbook" hidden>
      <p id="riddleText" aria-live="polite"></p>
      <button id="riddleClose" type="button" aria-label="Close the spellbook">&times;</button>
    </div>

    <!-- Start screen: shown until Enter is pressed -->
    <section id="start" aria-labelledby="title">
      <h1 id="title">Hallo<span>"weenie"</span></h1>
      <p class="tagline">Something is brewing in the witch's attic…</p>
      <label class="motion">
        <input type="checkbox" id="reduceMotion">
        Reduce motion
      </label>
      <button id="enter" type="button">Enter</button>
    </section>

    <!-- Final screen (story.js): shown after all three stories are found -->
    <section id="finale" role="dialog" aria-modal="true" aria-labelledby="finaleTitle" hidden>
      <h2 id="finaleTitle">You found the witch!</h2>
      <p class="tagline">The cat's witch is home at last. All three stories are found.</p>
      <button id="restart" type="button">Restart</button>
    </section>
  </main>
  <script src="main.js"></script>
  <script src="story.js"></script>
  <script src="story2.js"></script>
  <script src="story3.js"></script>
</body>
</html>
